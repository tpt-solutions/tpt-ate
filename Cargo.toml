[workspace]
resolver = "2"
members = [
    "tpt-ate-comm",
    "tpt-ate-test",
    "tpt-ate-assembly",
    "tpt-ate-aggregate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-ate"

[workspace.dependencies]
tpt-ate-comm = { path = "tpt-ate-comm" }
tpt-ate-test = { path = "tpt-ate-test" }
tpt-ate-assembly = { path = "tpt-ate-assembly" }
tpt-ate-aggregate = { path = "tpt-ate-aggregate" }

# External dependencies
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.clippy]
all = "warn"
